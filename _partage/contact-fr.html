<!doctype html><!-- Image de partage contact (fr), gabarit droite. Pour garder ce fichier tel quel, ajouter data-ajuste sur la balise html. -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/socle.css"><link rel="stylesheet" href="/assets/css/site.css">
<style>:root{--fond:#f1e9da;--texte:#2b2320}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--fond);color:var(--texte)}
.pg-carte{position:relative;width:1200px;height:630px;overflow:hidden}
.pg-photo{position:absolute;object-fit:cover;object-position:50% 54%}
.pg-logo{height:64px;width:auto;max-width:280px;object-fit:contain;object-position:left center;display:block}
.pg-accroche{font-family:var(--police-titres, Georgia, serif);font-size:62px;line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
.pg-nom{font-size:22px;font-weight:600;margin:0;opacity:.85}
</style></head><body><div class="pg-carte">
<div style="position:absolute;inset:0 600px 0 0;display:flex;flex-direction:column;justify-content:space-between;padding:56px 56px 52px 64px">
  <img class="pg-logo" src="/assets/images/logo.svg" alt="">
  <p class="pg-accroche">Un appel suffit</p>
  <p class="pg-nom">Lo Componaïro</p>
</div>
<img class="pg-photo" src="/assets/images/maison-porte-784.webp" alt="" data-sujet="21.3,19.8,50.3,68.2" style="left:600px;top:0;width:600px;height:630px">
<div class="pg-voile" style="position:absolute;left:600px;top:0;width:90px;height:630px;background:linear-gradient(to right, var(--fond), transparent)"></div>
</div></body></html>
